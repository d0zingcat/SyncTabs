name: Publish image and deploy to Dokploy

on:
  push:
    branches: ['fix/relay-docker-build']
  pull_request:
    branches: ['fix/relay-docker-build']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dokploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'd0zingcat/SyncTabs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/fix/relay-docker-build' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: relay
          file: relay/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/fix/relay-docker-build' }}
          tags: |
            ghcr.io/d0zingcat/synctabs-relay:latest
            ghcr.io/d0zingcat/synctabs-relay:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dokploy-linux-amd64
          cache-to: type=gha,mode=max,scope=dokploy-linux-amd64

      - name: Notify Dokploy
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/fix/relay-docker-build' && vars.DOKPLOY_AUTO_DEPLOY == 'true' }}
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo 'Required Dokploy webhook secret is missing.' >&2
            exit 1
          fi
          status=$(curl --fail --silent --show-error --max-time 60 \
            --output /dev/null --request POST "$DOKPLOY_DEPLOY_URL" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --write-out '%{http_code}')
          case "$status" in
            2??) ;;
            *) echo "Dokploy webhook returned HTTP $status." >&2; exit 1 ;;
          esac
          echo 'Dokploy accepted the deployment webhook; verify application health in Dokploy.'
